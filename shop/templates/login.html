<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2e7d32;      /* Fresh Grocery Green */
            --primary-hover: #1b5e20;      /* Darker Green for hover */
            --accent-color: #e8f5e9;       /* Light Soft Green */
            --text-dark: #1f2937;          /* Dark Charcoal */
            --text-muted: #6b7280;         /* Muted Gray */
            --border-color: #d1d5db;       /* Border Gray */
            --error-color: #dc2626;        /* Alert Red */
            --white: #ffffff;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--accent-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(46, 125, 50, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(46, 125, 50, 0.08) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--white);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(46, 125, 50, 0.12);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .brand-logo svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .brand-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .brand-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px 12px 44px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-dark);
            background-color: var(--white);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #e5e7eb;
        }

        .divider span {
            padding: 0 12px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1.5px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: var(--accent-color);
        }

        .alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            background-color: #fef2f2;
            color: var(--error-color);
            border: 1px solid #fecaca;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- ShopEase Branding -->
        <div class="brand-header">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M17,8C8,10 59,16.17 3.82,21.34L5.71,22L6.58,20.58C9.7,16.5 15.5,14 21,13.5C21.5,8.5 19,4.5 17,8Z"/>
                    <path d="M3.27,12.27C4.7,8.27 8.7,5.27 13.27,5.27C12.27,7.27 10.77,10.27 3.27,12.27Z" opacity="0.6"/>
                </svg>
            </div>
            <h1>ShopEase</h1>
            <p>Sign in to manage your grocery account</p>
        </div>

        <!-- Inline Alert Banner -->
        <div id="alertBox" class="alert-box">
            Invalid username or password
        </div>

        <!-- Form Container -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Username Input -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-control" 
                        placeholder="Enter username" 
                        required 
                        autocomplete="username"
                    />
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    />
                </div>
            </div>

            <!-- Submit Button (Triggers Login Action) -->
            <button type="submit" class="btn btn-primary">
               <a href="{% url 'add' %}"> Login to ShopEase </a>
            </button>
        </form>

        <div class="divider">
            <span>Or</span>
        </div>

        <!-- Redirect to Home Button -->
        <a href="{% url 'home' %}" class="btn btn-secondary">
            Return to ShopEase Home
        </a>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            const VALID_USER = "radhika vyas";
            const VALID_PASS = "123456";

            if (usernameInput.toLowerCase() === VALID_USER.toLowerCase() && passwordInput === VALID_PASS) {
                alertBox.style.display = "none";
                
           
          
                window.location.href = "{% url 'add' %}"; 

            } else {
                alertBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
