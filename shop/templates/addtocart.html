<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Cart</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:30px;
}

table{
    width:90%;
    margin:auto;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:15px;
    text-align:center;
    border:1px solid #ddd;
}

img{
    width:80px;
    height:80px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

.total{
    width:90%;
    margin:auto;
    text-align:right;
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.checkout{
    text-align:right;
    width:90%;
    margin:auto;
    margin-top:20px;
}

</style>

</head>
<body>

<h1 align="center">🛒 My Cart</h1>

<table>

<tr>
    <th>Image</th>
    <th>Product</th>
    <th>Price/Kg</th>
    <th>Quantity (Kg)</th>
    <th>Total</th>
    <th>Remove</th>
</tr>

{% for i in cart %}

<tr>

<td>
<img src="{{ i.product.image.url }}">
</td>

<td>{{ i.product.name }}</td>

<td>₹{{ i.product.price }}</td>

<td>

<form method="POST" action="{% url 'updatecart' i.id %}">
{% csrf_token %}

<input type="number"
       name="quantity"
       value="{{ i.quantity }}"
       step="0.5"
       min="0.5">

<button>Update</button>

</form>

</td>

<td>

₹{{ i.total }}

</td>

<td>

<a href="{% url 'deletecart' i.id %}">
<button>Remove</button>
</a>

</td>

</tr>

{% endfor %}

</table>

<div class="total">

Grand Total :
₹{{ grandtotal }}

</div>

<div class="checkout">

<a href="{% url 'billing' %}">
<button>Proceed to Billing</button>
</a>

</div>

</body>
</html>
